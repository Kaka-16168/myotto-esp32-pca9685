      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # ...（保留你原有的清理和 sdkconfig.defaults 配置）...
          
          # --- 核心修复：强制修改 IDF 组件源码 ---
          # 1. 找到 esp_https_ota 的 CMakeLists.txt
          OTA_CMAKE_FILE="$IDF_PATH/components/esp_https_ota/CMakeLists.txt"
          
          # 2. 检查文件是否存在，如果存在则注入依赖
          if [ -f "$OTA_CMAKE_FILE" ]; then
            echo "Patching $OTA_CMAKE_FILE to add missing dependency..."
            # 使用 sed 命令在 idf_component_register 的 REQUIRES 或 PRIV_REQUIRES 中添加 esp_bootloader_format
            sed -i 's/idf_component_register(/idf_component_register(\n    REQUIRES esp_bootloader_format/' "$OTA_CMAKE_FILE"
          else
            echo "Error: $OTA_CMAKE_FILE not found!"
            exit 1
          fi
          # ----------------------------------------

          # 4. 编译
          idf.py set-target esp32s3
          export IDF_PY_BUILD_JOBS=2
          idf.py reconfigure
          idf.py build
          idf.py merge-bin
