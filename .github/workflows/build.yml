name: Build Otto Robot Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32  # 如果内容在根目录，请删除此行
          
          # 彻底清理所有历史缓存和配置
          rm -rf build sdkconfig sdkconfig.old
          
          # 直接调用官方脚本，语言由 --language 参数控制，唤醒词使用默认值
          python scripts/build.py otto-robot --language zh-CN
          
          # 合并固件
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
