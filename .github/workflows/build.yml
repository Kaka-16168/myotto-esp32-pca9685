name: Build Otto Robot Firmware

on:
  # 允许在 GitHub 网页上手动点击按钮编译
  workflow_dispatch:
  # 推送到 main 分支时自动编译
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 采用官方最新稳定版容器，确保最安全的编译环境
    container:
      image: espressif/idf:release-v6.1
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Otto Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          
          # ⚠️ 注意：如果你的仓库根目录就是 xiaozhi-esp32 里面的内容，
          # 请把下面这行 `cd xiaozhi-esp32` 删掉。
          cd xiaozhi-esp32
          
          # 清理旧配置
          rm -f sdkconfig
          
          # 1. 指定板子为 Otto
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          
          # 2. 开启内存与网络支持 (N16R8)
          echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> sdkconfig.defaults
          echo "CONFIG_HTTPD_WS_SUPPORT=y" >> sdkconfig.defaults
          
          # 3. 防止屏幕花屏 (SPI ISR 驻留 IRAM)
          echo "CONFIG_SPI_MASTER_ISR_IN_IRAM=y" >> sdkconfig.defaults
          
          # 4. 🌟 开启“卡卡”唤醒词
          echo "CONFIG_USE_CUSTOM_WAKE_WORD=y" >> sdkconfig.defaults
          echo 'CONFIG_CUSTOM_WAKE_WORD="ka ka"' >> sdkconfig.defaults
          echo 'CONFIG_CUSTOM_WAKE_WORD_DISPLAY="卡卡"' >> sdkconfig.defaults
          echo "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=15" >> sdkconfig.defaults
          
          # 5. 强制关闭音频处理器与 BluFi，防止 v6.1 版本下的 PSA 加密库依赖冲突
          echo "CONFIG_USE_AUDIO_PROCESSOR=n" >> sdkconfig.defaults
          echo "CONFIG_USE_ESP_BLUFI_WIFI_PROVISIONING=n" >> sdkconfig.defaults
          
          # 6. 开始编译
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 产物名称
          name: otto-esp32s3-firmware
          # ⚠️ 确保这里路径正确（不要带中文句号）
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
