name: Build Otto Robot Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32  # 如果你是把内容直接放在了根目录，请把这行删掉
          
          # 清理旧配置
          rm -f sdkconfig
          
          # 注入 PSRAM 等配置
          echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> sdkconfig.defaults
          echo "CONFIG_SPI_MASTER_ISR_IN_IRAM=y" >> sdkconfig.defaults
          
          # 🌟 核心修复：不要直接用 idf.py build！
          # 使用小智官方的 python 脚本编译，它会自动把唤醒词模型打包到 assets 分区！
          # 假设你的板子名字在 config.json 里叫 otto-robot
          python scripts/build.py otto-robot
          
          # 编译完成后合并固件
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
