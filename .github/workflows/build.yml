name: Build Otto Robot Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 彻底清理所有缓存和配置文件
          rm -rf build sdkconfig sdkconfig.old
          
          # 直接调用官方脚本，语言和唤醒词由 config.json 和 --language 参数控制
          python scripts/build.py otto-robot --language zh-CN
          
          # 合并固件
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
