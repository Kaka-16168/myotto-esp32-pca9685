name: Build Otto Robot Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 固定 pyparsing 版本，避免解析异常
          pip install pyparsing==3.0.9
          
          rm -rf build
          rm -f sdkconfig
          
          # 1. 核心板型与功能
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          echo "CONFIG_HTTPD_WS_SUPPORT=y" >> sdkconfig.defaults
          
          # 2. 内存防重启配置 (N16R8 必开 8MB PSRAM)
          echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> sdkconfig.defaults
          
          # 3. 防止屏幕花屏
          echo "CONFIG_SPI_MASTER_ISR_IN_IRAM=y" >> sdkconfig.defaults
          
          # 4. 唤醒词及 OTA 自定义唤醒功能
          echo "CONFIG_USE_AFE_WAKE_WORD=y" >> sdkconfig.defaults
          echo "CONFIG_USE_CUSTOM_WAKE_WORD=y" >> sdkconfig.defaults
          echo "CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=y" >> sdkconfig.defaults
          
          # 5. 清理并编译
          idf.py set-target esp32s3
          idf.py reconfigure
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
